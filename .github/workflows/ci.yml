name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # pnpm comes from the `packageManager` field, so CI runs the same version
      # the lockfile was written with.
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build, typecheck and test in one gate: `verify` is what a release runs too.
      - name: Verify
        run: pnpm run verify

      - name: Pack check
        run: pnpm -r publish --dry-run --access public --no-git-checks
