name: Windows ACL native audit

on:
  push:
    branches:
      - ci/windows-acl-native-audit
    paths:
      - .github/workflows/windows-acl-native-audit.yml
      - verify/windows-acl/native/verify-artifact.mjs
      - verify/windows-acl/native/win32-audit.cpp
      - verify/windows-acl/native/win32-owned-worker.cpp
      - verify/windows-acl/fixtures/inspect-token-default-dacl.mjs
      - verify/windows-acl/fixtures/tier20-worker.mjs
      - verify/windows-acl/scripts/run-dsh-token-snapshot.mjs
      - verify/windows-acl/scripts/run-owned-worker-probe.mjs
      - verify/windows-acl/scripts/run-workspace-write-differential.mjs
      - verify/windows-acl/tests/**
      - verify/windows-acl/package.json
      - verify/windows-acl/pnpm-lock.yaml
      - verify/windows-acl/pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and self-test x64 audit probe
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Build and self-test the narrow native probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe was not found at $vswhere"
          }

          $vsRoot = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vsRoot)) {
            throw 'No x64 MSVC build-tools installation was found on the GitHub runner.'
          }
          $vcvars = Join-Path $vsRoot 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) {
            throw "vcvars64.bat was not found at $vcvars"
          }

          $source = Join-Path $env:GITHUB_WORKSPACE 'verify\windows-acl\native\win32-audit.cpp'
          $buildDirectory = Join-Path $env:RUNNER_TEMP 'node-repl-win32-audit-build'
          $output = Join-Path $buildDirectory 'node-repl-win32-audit.exe'
          New-Item -ItemType Directory -Force -Path $buildDirectory | Out-Null

          $compile = "call `"$vcvars`" >nul && cl.exe /nologo /std:c++20 /O2 /MT /W4 /WX /EHsc /DUNICODE /D_UNICODE /Fe:`"$output`" `"$source`""
          & cmd.exe /d /s /c $compile
          if ($LASTEXITCODE -ne 0) {
            throw "MSVC compilation failed with exit code $LASTEXITCODE"
          }

          foreach ($mode in @('abi', 'handle-sentinel', 'job-settlement')) {
            & $output $mode
            if ($LASTEXITCODE -ne 0) {
              throw "Native audit mode $mode failed with exit code $LASTEXITCODE"
            }
          }

          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'native-audit-artifact'
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          $artifactExe = Join-Path $artifactDirectory 'node-repl-win32-audit.exe'
          Copy-Item -LiteralPath $output -Destination $artifactExe -Force
          $sha256 = (Get-FileHash -LiteralPath $artifactExe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256 *node-repl-win32-audit.exe" | Set-Content -LiteralPath (Join-Path $artifactDirectory 'SHA256SUMS.txt') -Encoding utf8

          $compilerVersion = (& cmd.exe /d /s /c "call `"$vcvars`" >nul && cl.exe 2>&1" | Select-Object -First 1).Trim()
          $sdkIncludeRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdkVersion = if (Test-Path -LiteralPath $sdkIncludeRoot -PathType Container) {
            (Get-ChildItem -LiteralPath $sdkIncludeRoot -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1 -ExpandProperty Name)
          } else {
            'unknown'
          }
          if ([string]::IsNullOrWhiteSpace($sdkVersion)) {
            throw "No numeric Windows SDK include version was found below $sdkIncludeRoot"
          }
          $manifest = [ordered]@{
            schemaVersion = 1
            artifact = 'node-repl-win32-audit.exe'
            sha256 = $sha256
            sourceCommit = $env:GITHUB_SHA
            workflowRef = $env:GITHUB_WORKFLOW_REF
            generatedAt = [DateTime]::UtcNow.ToString('o')
            runner = [ordered]@{
              os = $env:RUNNER_OS
              architecture = $env:RUNNER_ARCH
              image = $env:ImageOS
              imageVersion = $env:ImageVersion
            }
            compiler = [ordered]@{
              version = $compilerVersion
              windowsSdkVersion = $sdkVersion
              command = 'cl.exe /nologo /std:c++20 /O2 /MT /W4 /WX /EHsc /DUNICODE /D_UNICODE'
            }
            selfTestModes = @('abi', 'handle-sentinel', 'job-settlement')
            nonClaims = @(
              'This artifact is a non-production evidence helper, not a sandbox or runtime launcher.',
              'It does not create a restricted token, configure DACL/Low-integrity ACLs, or establish a Windows ACL backend.',
              'A successful artifact cannot enable sandboxHost required or make an unsupported mode supported.'
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $artifactDirectory 'manifest.json') -Encoding utf8

      - name: Upload short-retention evidence helper
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-acl-native-audit-${{ github.sha }}
          path: native-audit-artifact
          if-no-files-found: error
          retention-days: 7

      - name: Install the minimum supported Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          architecture: x64

      - name: Verify the minimum Node runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = (Get-Command node.exe).Source
          $version = (& $node --version).Trim()
          if ($version -ne 'v22.19.0') {
            throw "Expected the minimum supported Node v22.19.0, got $version at $node"
          }
          "Tier 20 target runtime: $node ($version)"

      - name: Build and run Tier 20 owned-worker probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $vcvars = Join-Path $vsRoot 'VC\Auxiliary\Build\vcvars64.bat'
          $source = Join-Path $env:GITHUB_WORKSPACE 'verify\windows-acl\native\win32-owned-worker.cpp'
          $buildDirectory = Join-Path $env:RUNNER_TEMP 'node-repl-win32-owned-worker-build'
          $output = Join-Path $buildDirectory 'node-repl-win32-owned-worker.exe'
          New-Item -ItemType Directory -Force -Path $buildDirectory | Out-Null
          $compile = "call `"$vcvars`" >nul && cl.exe /nologo /std:c++20 /O2 /MT /W4 /WX /EHsc /DUNICODE /D_UNICODE /Fe:`"$output`" `"$source`""
          & cmd.exe /d /s /c $compile
          if ($LASTEXITCODE -ne 0) {
            throw "Tier 20 native compilation failed with exit code $LASTEXITCODE"
          }

          $tier20Evidence = Join-Path $env:RUNNER_TEMP 'node-repl-tier20-evidence'
          New-Item -ItemType Directory -Force -Path $tier20Evidence | Out-Null
          $env:NODE_REPL_VERIFY_TIER20_NATIVE = $output
          $env:NODE_REPL_VERIFY_OUT = $tier20Evidence
          $env:NODE_REPL_VERIFY_NODE = (Get-Command node.exe).Source
          & node (Join-Path $env:GITHUB_WORKSPACE 'verify\windows-acl\scripts\run-owned-worker-probe.mjs')
          $probeExit = $LASTEXITCODE
          $evidencePath = Join-Path $tier20Evidence '20-owned-restricted-token-job\evidence.json'
          if (Test-Path -LiteralPath $evidencePath -PathType Leaf) {
            Get-Content -LiteralPath $evidencePath -Raw
          }
          $tier20Artifact = Join-Path $env:GITHUB_WORKSPACE 'tier20-owned-worker-artifact'
          New-Item -ItemType Directory -Force -Path $tier20Artifact | Out-Null
          Copy-Item -LiteralPath $output -Destination (Join-Path $tier20Artifact 'node-repl-win32-owned-worker.exe') -Force
          if (Test-Path -LiteralPath $evidencePath -PathType Leaf) {
            Copy-Item -LiteralPath $evidencePath -Destination (Join-Path $tier20Artifact 'evidence.json') -Force
          }
          if ($probeExit -ne 0) {
            throw "Tier 20 owned-worker probe failed with exit code $probeExit"
          }

      - name: Upload Tier 20 owned-worker evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-acl-tier20-owned-worker-${{ github.sha }}
          path: tier20-owned-worker-artifact
          if-no-files-found: warn
          retention-days: 7

      - name: Check out exact DSH ACL source reference
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dshRoot = Join-Path $env:RUNNER_TEMP 'node-repl-pinned-dsh-reference'
          New-Item -ItemType Directory -Path $dshRoot -ErrorAction Stop | Out-Null
          git -C $dshRoot init --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize pinned DSH reference checkout' }
          git -C $dshRoot remote add origin https://github.com/lyd123qw2008/deepseek-harness.git
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure pinned DSH reference remote' }
          git -C $dshRoot fetch --quiet --depth=1 origin f9d6609d182969c9f57499ef552edb78835cc4e4
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch pinned DSH reference commit' }
          git -C $dshRoot checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out pinned DSH reference commit' }
          $revision = (& git -C $dshRoot rev-parse HEAD).Trim()
          if ($revision -ne 'f9d6609d182969c9f57499ef552edb78835cc4e4') { throw "Unexpected DSH source revision $revision" }
          "Pinned DSH source: $revision"

      - name: Install pinned DSH and verifier dependencies
        shell: pwsh
        env:
          CI: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $dshRoot = Join-Path $env:RUNNER_TEMP 'node-repl-pinned-dsh-reference'
          Push-Location $dshRoot
          try {
            corepack pnpm install --filter '@deepseek-ai/dsh-sandbox-windows-acl...' --filter '@deepseek-ai/dsh-root' --frozen-lockfile --prefer-offline
            if ($LASTEXITCODE -ne 0) { throw 'Pinned DSH dependency install failed' }
          } finally {
            Pop-Location
          }
          $verifierRoot = Join-Path $env:GITHUB_WORKSPACE 'verify\windows-acl'
          Push-Location $verifierRoot
          try {
            corepack pnpm install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'Windows ACL verifier dependency install failed' }
          } finally {
            Pop-Location
          }

      - name: Run one-shot Node 22.19 A1-A5 differential
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tier20Evidence = Join-Path $env:RUNNER_TEMP 'node-repl-tier20-evidence'
          $buildOutput = Join-Path $env:RUNNER_TEMP 'node-repl-win32-owned-worker-build\node-repl-win32-owned-worker.exe'
          $env:NODE_REPL_VERIFY_TIER20_NATIVE = $buildOutput
          $env:NODE_REPL_VERIFY_NODE = (Get-Command node.exe).Source
          $env:NODE_REPL_VERIFY_OUT = $tier20Evidence
          $env:NODE_REPL_VERIFY_DSH_ROOT = Join-Path $env:RUNNER_TEMP 'node-repl-pinned-dsh-reference'
          $matrixArtifact = Join-Path $env:RUNNER_TEMP 'node-repl-workspace-write-differential-artifact'
          New-Item -ItemType Directory -Force -Path $matrixArtifact | Out-Null
          & node (Join-Path $env:GITHUB_WORKSPACE 'verify\windows-acl\scripts\run-workspace-write-differential.mjs')
          $matrixExit = $LASTEXITCODE
          $matrixEvidence = Join-Path $tier20Evidence '20-workspace-write-differential\evidence.json'
          $dshEvidence = Join-Path $tier20Evidence '10-dsh-token-snapshot\evidence.json'
          if (Test-Path -LiteralPath $matrixEvidence -PathType Leaf) { Copy-Item -LiteralPath $matrixEvidence -Destination $matrixArtifact -Force }
          if (Test-Path -LiteralPath $dshEvidence -PathType Leaf) { Copy-Item -LiteralPath $dshEvidence -Destination $matrixArtifact -Force }
          if ($matrixExit -ne 0) { throw "A1-A5 matrix was inconclusive (exit $matrixExit); inspect the uploaded evidence." }

      - name: Upload one-shot DSH differential evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-acl-workspace-write-differential-${{ github.sha }}
          path: ${{ runner.temp }}\node-repl-workspace-write-differential-artifact
          if-no-files-found: warn
          retention-days: 7
