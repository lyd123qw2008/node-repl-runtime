name: Windows ACL native audit

on:
  push:
    branches:
      - ci/windows-acl-native-audit
    paths:
      - .github/workflows/windows-acl-native-audit.yml
      - verify/windows-acl/native/**
      - verify/windows-acl/fixtures/tier20-worker.mjs
      - verify/windows-acl/scripts/run-owned-worker-probe.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and self-test x64 audit probe
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Build and self-test the narrow native probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe was not found at $vswhere"
          }

          $vsRoot = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vsRoot)) {
            throw 'No x64 MSVC build-tools installation was found on the GitHub runner.'
          }
          $vcvars = Join-Path $vsRoot 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) {
            throw "vcvars64.bat was not found at $vcvars"
          }

          $source = Join-Path $env:GITHUB_WORKSPACE 'verify\windows-acl\native\win32-audit.cpp'
          $buildDirectory = Join-Path $env:RUNNER_TEMP 'node-repl-win32-audit-build'
          $output = Join-Path $buildDirectory 'node-repl-win32-audit.exe'
          New-Item -ItemType Directory -Force -Path $buildDirectory | Out-Null

          $compile = "call `"$vcvars`" >nul && cl.exe /nologo /std:c++20 /O2 /MT /W4 /WX /EHsc /DUNICODE /D_UNICODE /Fe:`"$output`" `"$source`""
          & cmd.exe /d /s /c $compile
          if ($LASTEXITCODE -ne 0) {
            throw "MSVC compilation failed with exit code $LASTEXITCODE"
          }

          foreach ($mode in @('abi', 'handle-sentinel', 'job-settlement')) {
            & $output $mode
            if ($LASTEXITCODE -ne 0) {
              throw "Native audit mode $mode failed with exit code $LASTEXITCODE"
            }
          }

          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'native-audit-artifact'
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          $artifactExe = Join-Path $artifactDirectory 'node-repl-win32-audit.exe'
          Copy-Item -LiteralPath $output -Destination $artifactExe -Force
          $sha256 = (Get-FileHash -LiteralPath $artifactExe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256 *node-repl-win32-audit.exe" | Set-Content -LiteralPath (Join-Path $artifactDirectory 'SHA256SUMS.txt') -Encoding utf8

          $compilerVersion = (& cmd.exe /d /s /c "call `"$vcvars`" >nul && cl.exe 2>&1" | Select-Object -First 1).Trim()
          $sdkIncludeRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdkVersion = if (Test-Path -LiteralPath $sdkIncludeRoot -PathType Container) {
            (Get-ChildItem -LiteralPath $sdkIncludeRoot -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1 -ExpandProperty Name)
          } else {
            'unknown'
          }
          if ([string]::IsNullOrWhiteSpace($sdkVersion)) {
            throw "No numeric Windows SDK include version was found below $sdkIncludeRoot"
          }
          $manifest = [ordered]@{
            schemaVersion = 1
            artifact = 'node-repl-win32-audit.exe'
            sha256 = $sha256
            sourceCommit = $env:GITHUB_SHA
            workflowRef = $env:GITHUB_WORKFLOW_REF
            generatedAt = [DateTime]::UtcNow.ToString('o')
            runner = [ordered]@{
              os = $env:RUNNER_OS
              architecture = $env:RUNNER_ARCH
              image = $env:ImageOS
              imageVersion = $env:ImageVersion
            }
            compiler = [ordered]@{
              version = $compilerVersion
              windowsSdkVersion = $sdkVersion
              command = 'cl.exe /nologo /std:c++20 /O2 /MT /W4 /WX /EHsc /DUNICODE /D_UNICODE'
            }
            selfTestModes = @('abi', 'handle-sentinel', 'job-settlement')
            nonClaims = @(
              'This artifact is a non-production evidence helper, not a sandbox or runtime launcher.',
              'It does not create a restricted token, configure DACL/Low-integrity ACLs, or establish a Windows ACL backend.',
              'A successful artifact cannot enable sandboxHost required or make an unsupported mode supported.'
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $artifactDirectory 'manifest.json') -Encoding utf8

      - name: Upload short-retention evidence helper
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-acl-native-audit-${{ github.sha }}
          path: native-audit-artifact
          if-no-files-found: error
          retention-days: 7

      - name: Build and run Tier 20 owned-worker probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $vcvars = Join-Path $vsRoot 'VC\Auxiliary\Build\vcvars64.bat'
          $source = Join-Path $env:GITHUB_WORKSPACE 'verify\windows-acl\native\win32-owned-worker.cpp'
          $buildDirectory = Join-Path $env:RUNNER_TEMP 'node-repl-win32-owned-worker-build'
          $output = Join-Path $buildDirectory 'node-repl-win32-owned-worker.exe'
          New-Item -ItemType Directory -Force -Path $buildDirectory | Out-Null
          $compile = "call `"$vcvars`" >nul && cl.exe /nologo /std:c++20 /O2 /MT /W4 /WX /EHsc /DUNICODE /D_UNICODE /Fe:`"$output`" `"$source`""
          & cmd.exe /d /s /c $compile
          if ($LASTEXITCODE -ne 0) {
            throw "Tier 20 native compilation failed with exit code $LASTEXITCODE"
          }

          $tier20Evidence = Join-Path $env:RUNNER_TEMP 'node-repl-tier20-evidence'
          New-Item -ItemType Directory -Force -Path $tier20Evidence | Out-Null
          $env:NODE_REPL_VERIFY_TIER20_NATIVE = $output
          $env:NODE_REPL_VERIFY_OUT = $tier20Evidence
          $env:NODE_REPL_VERIFY_NODE = (Get-Command node.exe).Source
          & node (Join-Path $env:GITHUB_WORKSPACE 'verify\windows-acl\scripts\run-owned-worker-probe.mjs')
          if ($LASTEXITCODE -ne 0) {
            throw "Tier 20 owned-worker probe failed with exit code $LASTEXITCODE"
          }
          $tier20Artifact = Join-Path $env:GITHUB_WORKSPACE 'tier20-owned-worker-artifact'
          New-Item -ItemType Directory -Force -Path $tier20Artifact | Out-Null
          Copy-Item -LiteralPath $output -Destination (Join-Path $tier20Artifact 'node-repl-win32-owned-worker.exe') -Force
          Copy-Item -LiteralPath (Join-Path $tier20Evidence '20-owned-restricted-token-job\evidence.json') -Destination (Join-Path $tier20Artifact 'evidence.json') -Force

      - name: Upload Tier 20 owned-worker evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-acl-tier20-owned-worker-${{ github.sha }}
          path: tier20-owned-worker-artifact
          if-no-files-found: error
          retention-days: 7
